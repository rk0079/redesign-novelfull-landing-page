name: Build Reclaim iOS App

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install
      - name: Build unsigned iOS archive
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/build/Reclaim.xcarchive archive CODE_SIGNING_ALLOWED=NO
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: reclaim-ios-unsigned
          path: build/Reclaim.xcarchive
